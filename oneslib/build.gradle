plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
    withJavadocJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation fg.deobf("dev.tocraft:walkers-forge:${minecraft_version}-${walkers_version}")
    implementation fg.deobf("dev.tocraft:remorphed-forge:${minecraft_version}-${remorphed_version}")
    implementation fg.deobf("dev.tocraft:craftedcore-forge:${minecraft_version}-${craftedcore_version}")

    runtimeOnly 'com.eliotlash.mclib:mclib:20'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
    quiet
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

// Cloudsmith publishing (Fase 5). Credentials live in ~/.gradle/gradle.properties:
//   cloudsmithUser=binaris
//   cloudsmithApiKey=...
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            version = mod_version
            artifact tasks.named('jar')
            artifact tasks.named('sourcesJar')
            artifact tasks.named('javadocJar')
            pom.withXml {
                def root = asNode()
                def dependenciesNode = root.get('dependencies')
                if (dependenciesNode) {
                    root.remove(dependenciesNode[0])
                }
                def deps = root.appendNode('dependencies')
                [
                        [groupId: 'software.bernie.geckolib', artifactId: "geckolib-forge-${minecraft_version}", version: geckolib_version],
                        [groupId: 'dev.tocraft', artifactId: 'walkers-forge', version: "${minecraft_version}-${walkers_version}"],
                        [groupId: 'dev.tocraft', artifactId: 'remorphed-forge', version: "${minecraft_version}-${remorphed_version}"],
                        [groupId: 'dev.tocraft', artifactId: 'craftedcore-forge', version: "${minecraft_version}-${craftedcore_version}"]
                ].each { dep ->
                    def dependencyNode = deps.appendNode('dependency')
                    dependencyNode.appendNode('groupId', dep.groupId)
                    dependencyNode.appendNode('artifactId', dep.artifactId)
                    dependencyNode.appendNode('version', dep.version)
                }
            }
        }
    }

    repositories {
        maven {
            name = 'cloudsmith'
            def cloudsmithOwner = findProperty('cloudsmithOwner') ?: 'binaris'
            def cloudsmithRepo = findProperty('cloudsmithRepo') ?: 'oneslib'
            url = uri(findProperty('cloudsmithUrl') ?: "https://maven.cloudsmith.io/${cloudsmithOwner}/${cloudsmithRepo}/")
            credentials {
                username = findProperty('cloudsmithUser') ?: System.getenv('CLOUDSMITH_USER')
                password = findProperty('cloudsmithApiKey') ?: System.getenv('CLOUDSMITH_API_KEY')
            }
        }
    }
}
