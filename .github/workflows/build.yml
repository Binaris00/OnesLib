name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :oneslib:test --no-daemon

      - name: GameTests
        run: ./gradlew :testmod:runGameTestServer --no-daemon

      - name: Build
        run: ./gradlew :oneslib:build -x javadoc --no-daemon
